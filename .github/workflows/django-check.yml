name: Django Check

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: django_example/requirements.txt

      - name: Instalar dependências
        run: pip install -r django_example/requirements.txt

      - name: Validar configuração Django
        working-directory: django_example
        run: python manage.py check

      - name: Verificar import do módulo NLP
        working-directory: django_example
        run: |
          python - <<'EOF'
          import sys, os
          sys.path.insert(0, os.path.dirname(os.getcwd()))
          os.chdir(os.path.dirname(os.getcwd()))
          import nlp_portugues as nlp
          nlp_pt = nlp.preprocessing_ptBR()
          resultado = nlp_pt.proc_text(
              text='Os corações valentes foram caminhando até chegar à Inglaterra.',
              verbs=True, adjectives=True, plural=True, string=True
          )
          assert resultado == 'coracao inglaterra', f'Resultado inesperado: {resultado}'
          print(f'NLP OK -> "{resultado}"')
          EOF
